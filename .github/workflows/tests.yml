name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and editable package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install ".[docs]"
          python -m pip install -e .
      - name: Run tests
        run: python -E -X utf8 -m pytest -q
