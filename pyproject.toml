[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-organizer"
version = "0.1.0"
description = "Read-only mail archive and evidence-based triage for two Gmail and one Outlook accounts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
auth = ["google-auth>=2", "google-auth-oauthlib>=1", "msal>=1.30", "keyring>=25", "requests>=2"]
test = ["pytest>=8"]
docs = ["pymupdf>=1.26", "python-docx>=1.2", "openpyxl>=3.1", "tzdata>=2025.2"]

[project.scripts]
mail-organizer = "mailorganizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
